[project]
name = "ecommerce-after-sales-agent"
version = "0.1.0"
description = "第四阶段电商售后服务智能体学生项目"
requires-python = ">=3.11,<3.13"
dependencies = ["python-dotenv>=1.0.0"]

[project.optional-dependencies]
deepseek = ["openai>=1.0.0"]
embedding = ["fastembed>=0.9.0,<1.0"]
chroma = ["chromadb>=0.4.0"]
# 单元12 解析 PDF 用；Markdown 与 CSV 走标准库，不需要额外依赖。
parse = ["pypdf>=4.0.0"]
# 单元13 RAGAS 评估用；评估指标本身只依赖标准库，装不装都能跑检索指标。
# 0.4.3 起指标在 ragas.metrics.collections 下（与课程参考实现同 API），且不再依赖
# langchain_community 的 vertexai 模块（ragas 0.3.1 配 langchain-community 0.4 会导入失败）。
evaluation = ["ragas>=0.4.3"]
# 单元16 LangChain 组合链用：Runnable/Prompt/Parser 在 langchain-core，
# ChatDeepSeek 在 langchain-deepseek。两者版本要对得上（core 1.x 配 deepseek 1.x）。
# 单元17 的 Agent 执行器用 langchain.agents.create_agent（内部由 langgraph 跑图）；
# 这两个包以前是"跟着 ragas 一起进来的"，显式写出来才不会哪天被解析掉。
langchain = [
    "langchain-core>=1.0,<2",
    "langchain-deepseek>=1.0,<2",
    "langchain>=1.4,<2",
    "langgraph>=1.0,<2",
]
# 单元17～19 教师参考实现（课程示例代码）对照用：它 import 的是 langchain_classic
# 与 langchain_chroma。本项目自己的代码一行都不 import 这两个包，但要在本机跑通参考
# 实现做对照就得装上；写进 extras 才不会被下一次 uv sync 卸掉。
classic = [
    "langchain-classic>=1.0,<2",
    "langchain-chroma>=1.0,<2",
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple"